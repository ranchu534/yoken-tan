<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#10121d">
<title>妖拳譚 - ようけんたん</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10121d;color:#fff;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;touch-action:none;user-select:none}
#wrap{height:100%;display:flex;flex-direction:column;max-width:900px;margin:auto;background:#151827}
header{height:48px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#0d1020;border-bottom:1px solid #343954}
.logo{font-weight:900;letter-spacing:.12em;color:#f5c66a}.sub{font-size:10px;color:#aeb5d0}
#stage{position:relative;flex:1;min-height:0;background:#20253a;overflow:hidden}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
#hud{position:absolute;left:12px;top:10px;right:12px;pointer-events:none;text-shadow:2px 2px #151827}
.hudrow{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:11px;font-weight:800}
.bar{height:10px;width:min(34vw,180px);border:2px solid #e9e6d7;background:#292d40;box-shadow:2px 2px #111}
.fill{height:100%;width:100%;background:#d94e5b;transition:width .12s}
#kiFill{background:#53c7d2}
#mission{position:absolute;right:12px;top:12px;font-size:10px;text-align:right;color:#fff;background:#101522b8;padding:6px 8px;border:1px solid #65708b}
#message{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);text-align:center;width:90%;font-weight:900;font-size:clamp(18px,5vw,30px);color:#ffe39b;text-shadow:3px 3px #291d2b;pointer-events:none}
#bottom{flex:none;background:#101321;padding:10px 14px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;gap:10px}
.pad,.actions{display:flex;align-items:center;gap:8px}
.ctrl{border:2px solid #64708e;background:linear-gradient(#303a59,#1c233a);color:white;border-radius:14px;min-width:54px;height:54px;font-size:21px;font-weight:900;box-shadow:0 4px #0a0d17;touch-action:none}
.ctrl:active,.ctrl.down{transform:translateY(3px);box-shadow:0 1px #0a0d17;background:#56668f}
.ctrl.attack{border-color:#c18b50;background:linear-gradient(#79502e,#3a2a28);font-size:13px;min-width:58px}
.ctrl.special{border-color:#4aafbd;background:linear-gradient(#276e7a,#193b50);font-size:12px;min-width:62px}
#start{position:fixed!important;inset:0!important;width:100vw;height:100vh;height:100dvh;z-index:99999!important;pointer-events:auto;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center;overflow:auto;background:radial-gradient(ellipse at 50% 25%,#543344 0%,#24243a 42%,#0c1020 100%)}
 #start:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 34px,#ffffff08 35px 36px);pointer-events:none}
 .panel{position:relative;width:min(100%,440px);border:2px solid #bd9657;background:linear-gradient(160deg,#25283cf2,#111625f5);padding:clamp(18px,5vw,28px) 20px;box-shadow:0 0 0 5px #171c2eaa,0 12px 45px #0009}
 .panel h1{font-size:clamp(34px,9vw,54px);margin:4px 0 0;color:#f4ce7b;letter-spacing:.2em;text-shadow:0 3px #713d38,0 0 22px #e6a45b66}
 .titleSub{color:#e3c99b;font-size:11px;letter-spacing:.25em;margin:4px 0 16px}
 .titleMark{font-size:clamp(34px,10vw,54px);line-height:1.2;color:#d9b16c;text-shadow:0 0 18px #e2a85a66}
 .panel p{line-height:1.8;color:#d7d9e6;font-size:13px}
 .menuButtons{display:grid;gap:10px;margin-top:18px}
 .menuBtn{position:relative;z-index:6;touch-action:manipulation;cursor:pointer;width:100%;border:1px solid #d4ad6b;color:#fff1d2;font-weight:900;font-size:16px;padding:13px 18px;border-radius:8px;background:linear-gradient(#8d493e,#542d35);box-shadow:0 4px #261b2a}
 .menuBtn.secondary{background:linear-gradient(#39435c,#20283e);border-color:#7583a1;font-size:14px}
 .menuBtn:active{transform:translateY(2px);box-shadow:0 2px #261b2a}
 #helpText{display:none;margin-top:12px;padding:10px;background:#0c1220;border:1px solid #555d77;border-radius:8px;color:#e2e5ef;font-size:12px;line-height:1.8}
 #continueBtn:disabled{opacity:.4;filter:grayscale(1);cursor:not-allowed}
#restart{position:absolute;right:12px;bottom:10px;border:1px solid #7c86a6;background:#171c2e;color:#fff;border-radius:8px;padding:7px 10px;font-size:11px}
@media(min-width:700px){#bottom{justify-content:center;gap:90px}.ctrl{width:64px;height:60px}}
</style>
</head>
<body>
<div id="wrap">
<header><div><div class="logo">妖拳譚 <span class="sub">YO-KEN TAN</span></div></div><div class="sub">第一章：鳥居の森</div></header>
<div id="stage">
<canvas id="game"></canvas>
<div id="hud">
 <div class="hudrow">体力 <div class="bar"><div class="fill" id="hpFill"></div></div><span id="hpText">100</span></div>
 <div class="hudrow">気力 <div class="bar"><div class="fill" id="kiFill"></div></div><span id="kiText">100</span></div>
 <div class="hudrow">Lv.<span id="levelText">1</span> EXP <div class="bar"><div class="fill" id="xpFill" style="background:#e8bd58"></div></div><span id="xpText">0/50</span></div>
</div>
<div id="mission">目的：妖怪を3体倒せ<br><span id="count">討伐 0 / 3</span></div>
<div id="message"></div>
<div id="start"><div class="panel"><div class="titleMark">⛩</div><h1>妖拳譚</h1><div class="titleSub">― 妖を討つ拳 ―</div><p>妖怪が巣食う夜の森。<br>拳に宿した気を解き放ち、森の奥へ進め。</p><div class="menuButtons"><button class="menuBtn" id="startBtn">冒険を始める</button><button class="menuBtn secondary" id="continueBtn" disabled>つづきから</button><button class="menuBtn secondary" id="helpBtn">遊び方・操作説明</button></div><div id="helpText">移動：◀ ▶<br>ジャンプ：▲<br>攻撃：拳撃<br>奥義：気功波（気力30消費）<br>妖怪を倒すと経験値を獲得。レベルアップで体力・気力が成長する！</div><div class="titleSub" style="margin:18px 0 0">和風妖怪アクション RPG</div></div></div>
<button id="restart">最初から</button>
</div>
<div id="bottom">
 <div class="pad"><button class="ctrl" data-key="left">◀</button><button class="ctrl" data-key="right">▶</button><button class="ctrl" data-key="jump">▲</button></div>
 <div class="actions"><button class="ctrl attack" data-key="attack">拳撃</button><button class="ctrl special" data-key="special">気功波</button></div>
</div>
</div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const hpFill=document.getElementById('hpFill'),kiFill=document.getElementById('kiFill'),hpText=document.getElementById('hpText'),kiText=document.getElementById('kiText'),xpFill=document.getElementById('xpFill'),xpText=document.getElementById('xpText'),levelText=document.getElementById('levelText'),countEl=document.getElementById('count'),msg=document.getElementById('message'),start=document.getElementById('start');
let W=800,H=450,last=0,started=false,won=false,lost=false,cam=0,kills=0,shake=0,levelUpRecovery=false;
const keys={left:false,right:false,jump:false,attack:false,special:false};
const worldW=2200;let ground=370;
let player,enemies,shots,particles;
function resize(){const r=canvas.getBoundingClientRect();const d=Math.min(window.devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=Math.max(1,Math.floor(W*d));canvas.height=Math.max(1,Math.floor(H*d));ctx.setTransform(d,0,0,d,0,0);ctx.imageSmoothingEnabled=false;ground=Math.max(130,Math.min(370,H*.78));if(player){player.y= Math.min(player.y,ground-player.h);}}
window.addEventListener('resize',resize);resize();
function reset(){levelUpRecovery=false;player={x:70,y:ground-48,w:30,h:48,hp:100,maxHp:100,ki:100,maxKi:100,level:1,exp:0,face:1,vy:0,on:false,atk:0,atkcd:0,spcd:0,inv:0,anim:0};enemies=[{x:380,hp:35,max:35,kind:0,cd:0},{x:730,hp:45,max:45,kind:1,cd:0},{x:1120,hp:45,max:45,kind:0,cd:0},{x:1650,hp:110,max:110,kind:2,cd:0}];shots=[];particles=[];cam=0;kills=0;won=lost=false;msg.textContent='';updateHud();}
function expNeed(){return 50+(player.level-1)*40}function updateHud(){hpFill.style.width=Math.max(0,player.hp/player.maxHp*100)+'%';kiFill.style.width=player.ki/player.maxKi*100+'%';hpText.textContent=Math.ceil(player.hp)+'/'+player.maxHp;kiText.textContent=Math.floor(player.ki)+'/'+player.maxKi;xpFill.style.width=(player.exp/expNeed()*100)+'%';xpText.textContent=player.exp+'/'+expNeed();levelText.textContent=player.level;countEl.textContent='討伐 '+kills+' / 3';}
function gainExp(amount){player.exp+=amount;msg.textContent='経験値 '+amount+' 獲得！';while(player.exp>=expNeed()){player.exp-=expNeed();player.level++;player.maxHp+=20;player.maxKi+=15;levelUpRecovery=true;player.inv=90;burst(player.x+15,player.y+20,'#ffe27a',24);msg.textContent='レベルアップ！ Lv.'+player.level+'\n体力・気力の最大値が上昇！'}updateHud()}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function text(t,x,y,size=12,color='#fff'){ctx.font=`bold ${size}px monospace`;ctx.fillStyle=color;ctx.fillText(t,x,y)}
function burst(x,y,color,n=8){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-.7)*5,life:25,color});}
function drawBg(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#171d35');g.addColorStop(.65,'#30344a');g.addColorStop(1,'#514052');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);rect(W*.78,48,34,34,'#e7d9a7');rect(W*.78+7,42,34,34,'#171d35');
 for(let i=0;i<18;i++){let x=((i*139-cam*.25)%(W+100)+W+100)%(W+100)-30;let y=100+(i*47)%130;rect(x,y,3,3,'#f5df9a')}
 for(let i=0;i<18;i++){let x=((i*95-cam*.45)%(W+100)+W+100)%(W+100)-30;let h=90+(i*31)%100;rect(x,ground-h,8,h,'#202b38');rect(x-17,ground-h+20,42,8,'#202b38');rect(x-10,ground-h+5,28,8,'#202b38')}
 for(let i=0;i<4;i++){let x=((i*360+180-cam*.75)%(W+300)+W+300)%(W+300)-80;rect(x,205,9,165,'#7c343d');rect(x+64,205,9,165,'#7c343d');rect(x-14,196,110,12,'#a8494a');rect(x-5,185,92,8,'#c35c52')}
 rect(0,ground,W,H-ground,'#292a38');rect(0,ground,W,7,'#77705c');for(let i=0;i<W/24+2;i++){let x=i*24-(cam%24);rect(x,ground+19,10,2,'#494050');rect(x+10,ground+39,5,2,'#494050')}
}
function drawPlayer(){let p=player,x=p.x-cam,y=p.y;if(p.inv>0&&Math.floor(p.inv/3)%2===0)return;rect(x+3,ground-3,28,4,'#171722');rect(x+7,y+32,7,15,'#292e49');rect(x+18,y+32,7,15,'#292e49');rect(x+5,y+44,11,4,'#d8d2c0');rect(x+17,y+44,12,4,'#d8d2c0');rect(x+5,y+17,21,19,'#b74742');rect(x+3,y+20,25,5,'#e1c58c');rect(x+9,y+3,15,15,'#e6b88e');rect(x+7,y,19,7,'#252638');rect(x+7,y-2,18,4,'#d9d5c8');rect(x+(p.face>0?20:7),y+9,3,3,'#201c25');if(p.atk>0){rect(x+(p.face>0?27:-10),y+21,15,9,'#e6b88e');rect(x+(p.face>0?37:-13),y+19,7,12,'#f4d39b')}else{rect(x+(p.face>0?23:0),y+23,7,9,'#e6b88e')}}
function drawEnemy(e){let x=e.x-cam,y=ground-(e.kind===2?75:43);if(x<-80||x>W+80)return;const boss=e.kind===2;rect(x+5,y+(boss?65:35),boss?48:28,7,'#171722');let c=boss?'#6b3c8e':e.kind===1?'#4b9a75':'#668a9d';rect(x+5,y+12,boss?44:25,boss?53:30,c);rect(x+2,y+5,boss?50:30,18,boss?'#9c5a9d':'#83a7a0');rect(x+8,y+10,4,4,'#f5d86c');rect(x+(boss?34:20),y+10,4,4,'#f5d86c');rect(x+(boss?0:3),y+(boss?0:2),boss?10:6,8,'#d6d0b6');rect(x+(boss?40:22),y+(boss?0:2),boss?10:6,8,'#d6d0b6');rect(x,y-9,(boss?60:36),4,'#342b3a');rect(x,y-9,(boss?60:36)*Math.max(0,e.hp/e.max),4,'#d94e5b');if(boss)text('森の大鬼',x,y-16,11,'#ffd78b')}
function draw(){ctx.clearRect(0,0,W,H);drawBg();for(const e of enemies)if(e.hp>0)drawEnemy(e);for(const s of shots){rect(s.x-cam,s.y,18,8,'#6ce7e8');rect(s.x-cam+4,s.y-3,8,14,'#d4ffff')}drawPlayer();for(const q of particles)rect(q.x-cam,q.y,3,3,q.color);if(shake>0)shake--}
function update(dt){if(!started||won||lost)return;let p=player;const step=dt/16.67;p.anim+=step;p.atkcd=Math.max(0,p.atkcd-step);p.spcd=Math.max(0,p.spcd-step);p.atk=Math.max(0,p.atk-step);p.inv=Math.max(0,p.inv-step);p.vx=(keys.right?2.7:0)-(keys.left?2.7:0);if(p.vx)p.face=Math.sign(p.vx);p.x=Math.max(0,Math.min(worldW-p.w,p.x+p.vx*step));if(keys.jump&&p.on){p.vy=-8.7;p.on=false;burst(p.x+15,p.y+45,'#d7c18b',4)}p.vy+=.42*step;p.y+=p.vy*step;if(p.y+p.h>=ground){p.y=ground-p.h;p.vy=0;p.on=true}
 if(keys.attack&&p.atkcd<=0){p.atk=10;p.atkcd=22;for(const e of enemies){if(e.hp>0&&Math.abs((e.x+15)-(p.x+p.w/2+p.face*30))<48&&Math.abs(e.x-p.x)<75){e.hp-=18;burst(e.x+15,ground-25,'#ffcf8a',9);if(e.hp<=0){kills++;gainExp(e.kind===2?100:25);burst(e.x+15,ground-25,'#b6e6d5',18)}}}}
 if(keys.special&&p.spcd<=0&&p.ki>=30){p.ki-=30;p.spcd=48;shots.push({x:p.x+p.face*25,y:p.y+22,vx:p.face*7,life:90});burst(p.x+15,p.y+22,'#70e9f2',12)}p.ki=Math.min(p.maxKi,p.ki+.08*step);
 for(const s of shots){s.x+=s.vx*step;s.life-=step;for(const e of enemies){if(e.hp>0&&Math.abs(e.x-s.x)<28){e.hp-=30;s.life=0;burst(e.x+15,ground-25,'#79f5ff',15);if(e.hp<=0){kills++;gainExp(e.kind===2?100:25);burst(e.x+15,ground-25,'#b6e6d5',18)}}}}shots=shots.filter(s=>s.life>0);
 for(const e of enemies){if(e.hp<=0)continue;let dist=p.x-e.x;if(Math.abs(dist)<95){e.x+=Math.sign(dist)*.55*step;if(e.cd<=0&&Math.abs(dist)<43&&p.inv<=0){p.hp-=e.kind===2?14:8;p.inv=42;e.cd=55;shake=5;burst(p.x+15,p.y+25,'#ed7777',8)}}e.cd=Math.max(0,e.cd-step)}for(const q of particles){q.x+=q.vx*step;q.y+=q.vy*step;q.life-=step}particles=particles.filter(q=>q.life>0);cam=Math.max(0,Math.min(worldW-W,p.x-W*.38));if(p.hp<=0){p.hp=0;lost=true;msg.textContent='力尽きた…　最初からで再挑戦！'}if(kills>=3&&enemies[3].hp<=0){won=true;msg.textContent='討伐成功！ 妖の森を救った！'}if(levelUpRecovery){player.hp=player.maxHp;player.ki=player.maxKi;levelUpRecovery=false;}updateHud()}
function loop(t){let dt=Math.min(34,t-last||16);last=t;update(dt);draw();requestAnimationFrame(loop)}
document.querySelectorAll('.ctrl').forEach(b=>{const k=b.dataset.key;const on=e=>{e.preventDefault();keys[k]=true;b.classList.add('down')},off=e=>{e.preventDefault();keys[k]=false;b.classList.remove('down')};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)});
window.addEventListener('keydown',e=>{let m={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'jump',KeyZ:'attack',KeyX:'special'}[e.code];if(m){keys[m]=true;e.preventDefault()}});window.addEventListener('keyup',e=>{let m={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'jump',KeyZ:'attack',KeyX:'special'}[e.code];if(m)keys[m]=false});
function beginGame(e){if(e){e.preventDefault();e.stopPropagation()}started=true;start.style.display='none';start.style.pointerEvents='none';msg.textContent=''}
const startBtn=document.getElementById('startBtn');startBtn.addEventListener('click',beginGame);startBtn.addEventListener('pointerup',beginGame);
 document.getElementById('helpBtn').addEventListener('click',()=>{const h=document.getElementById('helpText');h.style.display=h.style.display==='block'?'none':'block'});
 const continueBtn=document.getElementById('continueBtn');try{continueBtn.disabled=!localStorage.getItem('yokenTanSave')}catch(e){}
 continueBtn.addEventListener('click',()=>{try{const save=JSON.parse(localStorage.getItem('yokenTanSave')||'null');if(!save)return;reset();player.level=save.level||1;player.exp=save.exp||0;player.maxHp=save.maxHp||100;player.maxKi=save.maxKi||100;player.hp=Math.min(save.hp??player.maxHp,player.maxHp);player.ki=Math.min(save.ki??player.maxKi,player.maxKi);updateHud();beginGame()}catch(e){msg.textContent='セーブデータを読み込めませんでした'}});
 setInterval(()=>{if(!started||!player)return;try{localStorage.setItem('yokenTanSave',JSON.stringify({level:player.level,exp:player.exp,maxHp:player.maxHp,maxKi:player.maxKi,hp:player.hp,ki:player.ki}))}catch(e){}},1500);
document.getElementById('restart').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();reset();started=true;start.style.display='none';start.style.pointerEvents='none'});
reset();requestAnimationFrame(loop);
})();
</script>
</body></html>
